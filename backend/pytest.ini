[pytest]
markers =
    integration: exercises a real database; deselected unless you ask for it
    jellyfin: exercises a live Jellyfin; deselected unless you ask for it

# Integration tests need a live MySQL/MariaDB and real credentials in .env, so
# they stay out of the default run. Include them with:  pytest -m integration
# Likewise the cinema tests need a reachable Jellyfin:  pytest -m jellyfin
addopts = -m "not integration and not jellyfin"
