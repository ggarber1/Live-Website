# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: ggarb
# Owns the shared DynamoDB table that every livs_website service reads and writes.
# Deploy this stack before the app services -- they resolve the table from its
# CloudFormation outputs, so `sls deploy` on todoService fails until this exists.
service: infraService

stages:
  default:
    params:
      tableName: "livs-table-${sls:stage}"

provider:
  name: aws

resources:
  Resources:
    LivsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        # Single-table design: PK is the entity type ("TODO", "HABIT", ...) and
        # SK is the item id, so one query per PK fetches a whole collection.
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        # 25/25 is the ceiling of DynamoDB's always-free tier, so this costs the
        # same as 1/1 while leaving enough write capacity for a cascade delete.
        # At 1 WCU, deleting a habit with 25 completions takes ~25s to drain and
        # the service's bounded retry gives up long before that.
        ProvisionedThroughput:
          ReadCapacityUnits: 25
          WriteCapacityUnits: 25
        TableName: ${param:tableName}

  Outputs:
    LivsTableName:
      Value:
        Ref: LivsTable
    LivsTableArn:
      Value:
        Fn::GetAtt: [LivsTable, Arn]
